[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crystallizer-ai"
version = "1.0.0"
description = "An agent harness that gets cheaper the longer it runs by crystallizing repeated mechanical steps into tested, declarative skills."
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
authors = [{ name = "Koosha KZ" }]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX",
    "Typing :: Typed",
]
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
]
anthropic = ["anthropic==1.8.0"]

[project.scripts]
crystallizer = "crystallizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crystallizer = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "SIM", "RUF", "PL", "N", "C4", "PT", "RET", "ARG"]
ignore = [
    "PLR0911",  # many returns are clearer than nested branches in validators
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",  # keyword-heavy constructors are clearer than parameter objects here
    "PLR2004",  # literal thresholds are documented in the spec
    "S603",     # subprocess is used with argv lists only, never a shell
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLC0415", "ARG001", "ARG002", "PLR0904", "SIM117"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error"]

[tool.coverage.run]
branch = false
source = ["crystallizer"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "@overload",
    "\\.\\.\\.$",
]
